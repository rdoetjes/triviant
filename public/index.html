<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Trivial Pursuit</title>
    <link rel="stylesheet" href="./css/horror-style.css" id="theme-stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            margin: 0;
            padding: 0;
        }

        #crt {
            max-width: 1000px;
            margin: 0 auto;
            padding: 5px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            text-align: center;
            color: #FFD700;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        h3 {
            color: #1E90FF;
            margin-top: 5px;
            font-size: 1.1rem;
        }

        /* Player Configuration Screen */
        #playerConfigScreen {
            padding: 20px;
            background-color: rgba(30, 30, 60, 0.6);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="number"],
        select {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid #1E90FF;
            border-radius: 5px;
            padding: 12px 15px;
            color: white;
            margin: 8px 0;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: #FFD700;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            color: #FFD700;
            font-weight: 600;
        }

        button {
            background: linear-gradient(135deg, #1E90FF 0%, #4169E1 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background: linear-gradient(135deg, #4169E1 0%, #1E90FF 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        /* Player Configuration */
        .player-config {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* Game Screen */
        #gameScreen {
            padding: 20px;
            background-color: rgba(30, 30, 60, 0.6);
            border-radius: 10px;
        }

        #wedge-circle {
            margin: 0 auto;
        }

        .wedge path {
            cursor: pointer;
            stroke: #000;
            stroke-width: 1;
            transition: transform 0.2s ease;
        }

        .wedge-label {
            font-size: 10px;
            fill: white;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
        }

        /* Disable animations and hover transform */
        .wedge:hover path {
            transform: none;
        }

        svg text {
            font-family: 'Montserrat', sans-serif;
        }

        /* Use your existing gradients/colors */
        .pink {
            fill: url(#pinkGrad);
        }

        .blue {
            fill: url(#blueGrad);
        }

        .green {
            fill: url(#greenGrad);
        }

        .yellow {
            fill: url(#yellowGrad);
            fill-opacity: 0.9;
        }

        .brown {
            fill: url(#brownGrad);
        }

        .orange {
            fill: url(#orangeGrad);
        }

        /* Player Selection */
        #playerButtons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .player-button {
            padding: 12px 20px;
            margin: 5px;
            cursor: pointer;
            background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .active-player {
            border: none;
            background: linear-gradient(135deg, #fbe87e 0%, #FFD700 100%);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(236, 217, 6, 0.7);
        }

        #questionContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 5px;
            border-radius: 10px;
            margin-top: 5px;
        }

        .question-section{
            flex: 1;
            min-width: 200px;
            width: 100%;
        }

        #questionDisplay{
            height: 50%;
            min-height: 80px;
            background-color: #242a31;
            border-radius: 10px;
            padding: 10px;
        }

        /* Responsive adjustment */
        @media (max-width: 768px) {
            #questionContainer {
                flex-direction: column;
            }
        }

        .answer-container {
            margin-top: 25px;
        }

        #answerDisplay {
            min-height: 50px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 18px;
            line-height: 1.6;
            color: #fff;
            border-left: 5px solid #FFD700;
        }

        .blurred {
            filter: blur(8px);
            -webkit-filter: blur(8px);
            transition: all 0.5s ease;
        }

        #showAnswerBtn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: black;
            margin-top: 15px;
        }

        #showAnswerBtn:hover {
            background: linear-gradient(135deg, #FFA500 0%, #FFD700 100%);
        }

        #startGameBtn {
            background: linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%);
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
        }

        #addPlayerBtn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .category-button {
                width: 80px;
                height: 80px;
                margin: 8px;
                font-size: 14px;
            }

            h2 {
                font-size: 2rem;
            }

            #questionDisplay {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <svg width="0" height="0" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="pinkGrad" cx="70%" cy="33%" r="80%">
            <stop offset="0%" stop-color="#FFB6C1" />
            <stop offset="60%" stop-color="#FF69B4" />
            <stop offset="100%" stop-color="#FF1493" />
          </radialGradient>
          <radialGradient id="blueGrad" cx="80%" cy="50%" r="80%">
            <stop offset="0%" stop-color="#87CEFA" />
            <stop offset="60%" stop-color="#1E90FF" />
            <stop offset="100%" stop-color="#0000CD" />
          </radialGradient>
          <radialGradient id="greenGrad" cx="45%" cy="65%" r="80%">
            <stop offset="0%" stop-color="#90EE90" />
            <stop offset="60%" stop-color="#32CD32" />
            <stop offset="100%" stop-color="#006400" />
          </radialGradient>
          <radialGradient id="yellowGrad" cx="50%" cy="70%" r="80%">
            <stop offset="0%" stop-color="#FFFACD" />
            <stop offset="60%" stop-color="#FFD700" />
            <stop offset="100%" stop-color="#FFA500" />
          </radialGradient>
          <radialGradient id="brownGrad" cx="25%" cy="50%" r="80%">
            <stop offset="0%" stop-color="#D2B48C" />
            <stop offset="60%" stop-color="#A0522D" />
            <stop offset="100%" stop-color="#8B4513" />
          </radialGradient>
          <radialGradient id="orangeGrad" cx="50%" cy="35%" r="80%">
            <stop offset="0%" stop-color="#FFDAB9" />
            <stop offset="60%" stop-color="#FFA500" />
            <stop offset="100%" stop-color="#FF4500" />
          </radialGradient>
        </defs>
      
        <!-- Smarty candy-style circles -->
        <circle cx="50" cy="100" r="40" fill="url(#pinkGrad)" />
        <circle cx="120" cy="100" r="40" fill="url(#blueGrad)" />
        <circle cx="190" cy="100" r="40" fill="url(#greenGrad)" />
        <circle cx="260" cy="100" r="40" fill="url(#yellowGrad)" />
        <circle cx="330" cy="100" r="40" fill="url(#brownGrad)" />
        <circle cx="400" cy="100" r="40" fill="url(#orangeGrad)" />
      </svg>
      
      
    <div id="crt">
        <!-- Player Configuration Screen -->
        <div id="playerConfigScreen">
            <h2>TRIVIAL PURSUIT</h2>

            <!-- API Key Input -->
            <label>OPENAI API KEY:</label>
            <input type="text" id="apiKeyInput" placeholder="Enter API key" oninput="updateApiKey()" />
            <p></p>
            <!-- Language Selection -->
            <label data-i18n="Language:">Language:</label>
            <select id="languageSelect" onChange="updateLanguage()">
                <option value="Dutch">Dutch</option>
                <option value="English">English</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="German">German</option>
            </select>
            <p></p>

            <h3 data-i18n="Add Players (Maximum 6)">Add Players (Maximum 6)</h3>
            <div id="playerInputs">
                <div class="player-config">
                    <input type="text" placeholder="Player name" data-placeholder="Player name" class="player-name">
                    <input type="number" placeholder="Age" data-placeholder="Age" min="1" max="120" class="player-age">
                </div>
            </div>

            <button id="addPlayerBtn" onclick="addPlayerInput()" data-i18n="Add Player">Add Player</button>
            <button id="startGameBtn" onclick="startGame()" data-i18n="Start Game">Start Game</button>
        </div>

        <!-- Game Screen (initially hidden) -->
        <div id="gameScreen" style="display: none;">
            <h2>TRIVIAL PURSUIT</h2>

            <!-- Player Selection -->
            <div id="playerSelection">
                <h3 data-i18n="Select Player">Select Player</h3>
                <div id="playerButtons"></div>
            </div>

            <!-- Category Buttons -->
        

            <!-- Question and Answer Display -->
            <div id="questionContainer">
                <div id="categoryButtonsWrapper">
                    <h3 data-i18n="Select Category">Select Category</h3>
                    <svg viewBox="0 0 200 200" width="300" height="300" class="wedge-circle">
                        <g class="wedge" onclick="getQuestion('Pink', getCurrentPlayer().name, getCurrentPlayer().age)">
                            <path d="M100,100 L100,0 A100,100 0 0,1 186.6,50 Z" class="pink" />
                        </g>
                        <g class="wedge" onclick="getQuestion('Blue', getCurrentPlayer().name, getCurrentPlayer().age)">
                            <path d="M100,100 L186.6,50 A100,100 0 0,1 186.6,150 Z" class="blue" />
                        </g>
                        <g class="wedge" onclick="getQuestion('Green', getCurrentPlayer().name, getCurrentPlayer().age)">
                            <path d="M100,100 L186.6,150 A100,100 0 0,1 100,200 Z" class="green" />
                        </g>
                        <g class="wedge" onclick="getQuestion('Yellow', getCurrentPlayer().name, getCurrentPlayer().age)">
                            <path d="M100,100 L100,200 A100,100 0 0,1 13.4,150 Z" class="yellow" />
                        </g>
                        <g class="wedge" onclick="getQuestion('Brown', getCurrentPlayer().name, getCurrentPlayer().age)">
                            <path d="M100,100 L13.4,150 A100,100 0 0,1 13.4,50 Z" class="brown" />
                        </g>
                        <g class="wedge" onclick="getQuestion('Orange', getCurrentPlayer().name, getCurrentPlayer().age)">
                            <path d="M100,100 L13.4,50 A100,100 0 0,1 100,0 Z" class="orange" />
                        </g>
                    </svg>
                </div>
                <h3 data-i18n="Question">Question:</h3>
                <div class="question-section">
                    <div id="questionDisplay"></div>
                </div>
            </div>
            <button id="showAnswerBtn" onclick="showAnswer()" data-i18n="Show Answer">Show Answer</button>
        </div>
    </div>
    </div>

    <script src="https://cdn.skypack.dev/openai" type="module"></script>
    <script src="./src/app.js" type="module"></script>
</body>

</html>
